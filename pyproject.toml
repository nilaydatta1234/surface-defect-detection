[project]
name = "defect-detection"
version = "0.1.0"
description = "Steel surface defect detection on NEU-DET: YOLOv5 vs Faster R-CNN"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nilay Datta" }]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torchmetrics[detection]>=1.4",
    "pycocotools>=2.0.7",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defect_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a model for one step on CPU"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
